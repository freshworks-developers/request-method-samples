<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northwind Request Lab — Installation</title>
    <link rel="stylesheet" type="text/css" href="./assets/iparams.css" />
    <script defer src="{{{appclient}}}"></script>
  </head>
  <body>
    <div class="nx-install">
      <h2>Northwind Request Lab</h2>
      <p class="nx-install__subtitle">
        Configure Freshdesk credentials and optionally validate them with a live API call.
      </p>
      <form>
        <fw-input
          class="subdomain-field"
          label="Freshdesk subdomain"
          placeholder="company"
          hint-text="Subdomain only — e.g. acme for acme.freshdesk.com"
          required
        ></fw-input>
        <fw-input
          class="api-key-field"
          type="password"
          label="Freshdesk API key"
          hint-text="Used with encode(iparam.api_key) in request templates"
          required
        ></fw-input>
        <fw-checkbox class="validate-field">
          Validate credentials on save
        </fw-checkbox>
      </form>
    </div>

    <script async type="module" src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.esm.js"></script>
    <script async nomodule src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.js"></script>
    <script defer src="./assets/iparams.js"></script>
  </body>
</html>
